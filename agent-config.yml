# agent-config.yml
# Central configuration for the autonomous multi-agent pipeline.
# Edit this file to change models, skills, and runtime behaviour.
# Run `python scripts/validate_config.py` after editing.

# --- Providers ---
# Add any provider here. Each role picks one via its `provider:` field.
# Supported providers: anthropic | openai | google | mistral
providers:
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}      # export ANTHROPIC_API_KEY=sk-ant-...
    api_url: ${ANTHROPIC_BASE_URL}      # https://api.anthropic.com
  openai:
    api_key: ${OPENAI_API_KEY}         # export OPENAI_API_KEY=sk-...
    api_url: ${OPENAI_BASE_URL}         # https://api.openai.com/v1
  # google:
  #   api_key: ${GOOGLE_API_KEY}
  #   api_url: https://generativelanguage.googleapis.com/v1beta
  # mistral:
  #   api_key: ${MISTRAL_API_KEY}
  #   api_url: https://api.mistral.ai/v1

default_provider: anthropic            # Used when a role omits `provider:`

pipeline:
  parallel_execution: true             # Run independent tasks concurrently
  max_tester_retries: 3                # Tester→Coder loop limit before human escalation
  parallel_failure_policy:
    cr_fix: proceed                    # Independent branches continue on partial failure
    full_release: halt                 # All branches must succeed before proceeding

cost_governance:
  max_cost_per_run: 5.00               # USD — orchestrator halts and escalates if exceeded
  currency: USD

test_env:
  isolation: auto                      # auto | containerized | process | sequential
  runtime: docker                      # docker | podman | none (used when isolation: containerized or auto)
  port_pool:
    app: [3001, 3099]                  # Next free port assigned per parallel feature
    db: [5433, 5499]                   # Used for process isolation only

roles:
  orchestrator:
    provider: anthropic
    model: claude-opus-4-8
    tools:
      - read_files
      - task_planning
    skills:
      - ask-matt                # Routes orchestrator to the right skill per situation

  analyst:
    provider: anthropic
    model: claude-sonnet-5
    tools:
      - read_files
      - web_search
    skills:
      - to-spec                 # Converts requirements into a published spec
      - domain-modeling         # Pins down terminology and ubiquitous language
      - research                # Investigates questions against primary sources

  designer:
    provider: anthropic
    model: claude-sonnet-5
    optional: true              # Only activated when task has a UI/UX component
    tools:
      - read_files
      - write_files
    skills:
      - prototype               # Throwaway single-file HTML prototype
      - frontend-design         # Full design system work

  architect:
    provider: anthropic
    model: claude-opus-4-8
    tools:
      - read_files
      - write_files
    skills:
      - to-tickets              # Breaks spec into tasks with blocking-edge declarations
      - codebase-design         # Enforces small interfaces and clean seams

  coder:
    provider: anthropic
    model: claude-sonnet-5
    tools:
      - read_files
      - write_files
      - terminal
    skills:
      - implement               # Builds from spec/tickets with TDD at seams
      - diagnosing-bugs         # Disciplined red→minimise→fix→regression loop

  # Tester ensemble: two cross-provider generators + arbiter + consolidator
  # generator_a and generator_b run independently for perspective diversity
  # consolidator deduplicates findings; arbiter resolves disagreements
  tester_generator_a:
    provider: anthropic
    model: claude-haiku-4-5
    tools:
      - read_files
      - terminal
    skills:
      - tdd                     # Generates test cases from spec (structured output)

  tester_generator_b:
    provider: openai
    model: gpt-5.4
    tools:
      - read_files
      - terminal
    skills:
      - tdd                     # Independent perspective via different provider

  tester_arbiter:
    provider: anthropic
    model: claude-sonnet-5      # Stronger model for judgment on disagreements
    tools:
      - read_files
      - terminal
    skills:
      - code-review             # Resolves low/medium disagreements; escalates critical to human
      - quality                 # Autonomous post-code quality gate; emits pass/fail verdict

  tester_consolidator:
    provider: anthropic
    model: claude-haiku-4-5
    tools:
      - read_files
      - write_files
    skills:
      - tdd                     # Deduplicates findings, ranks by severity, produces test_plan.md

  release_documenter:
    provider: anthropic
    model: claude-sonnet-5
    tools:
      - read_files
      - write_files
    skills:
      - proj-deploy             # Reads pipeline-state.md, compiles signoff_package.md
    completeness_check: hard_block    # Pipeline halts if mandatory artifacts are missing

  deployer:
    provider: anthropic
    model: claude-haiku-4-5
    tools:
      - terminal
      - git
    skills:
      - proj-deploy             # Custom skill: reads deploy section below

deploy:
  container_runtime: none       # docker | podman | none
  registry: none                # docker.io | ghcr.io | local | none
  target_environment: local     # local | staging | production
  build_tool: none              # dockerfile | compose | none
  pre_deploy_checks:
    - tests
    - lint
